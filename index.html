<style>
/* Unified palette — no gradients, same in all modes */
:root {
  --bg: #1B2A4A;
  --bg-elevated: #223458;
  --bg-card: #152240;
  --bg-card-hover: #1a2d50;
  --fg: #E1AD01;
  --fg-dim: #FFFFFF;
  --fg-muted: #FFFFFF;
  --accent: #F5F3EE;
  --accent-dim: rgba(245,243,238,0.15);
  --accent-glow: rgba(245,243,238,0.25);
  --border: #2a3d5e;
  --danger: #e07a73;
  --success: #7ec9a3;
  --accent-text: #1B2A4A;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 20px;
  --font-display: 'Calibri', 'Microsoft JhengHei', '微軟正黑體', sans-serif;
  --font-body: 'Microsoft JhengHei', '微軟正黑體', 'Calibri', sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--fg-muted); border-radius: 3px; }

.container { max-width: 900px; margin: 0 auto; padding-block: 48px 80px; }

/* Hero */
.hero { text-align: left; margin-bottom: 48px; }
.hero h1 {
  font-family: var(--font-display); font-size: clamp(28px, 6vw, 42px);
  font-weight: 800; letter-spacing: -1px; margin-bottom: 8px;
  color: var(--fg);
}
.hero-bio {
  color: var(--fg-dim); font-size: 15px; max-width: 500px;
  margin: 0; line-height: 1.7;
}
.hero-row {
  display: flex; align-items: center; gap: 16px;
  margin-bottom: 20px; flex-wrap: wrap;
}
.hero-left { flex: 1; min-width: 200px; }
.hero-cta {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 12px 24px; border-radius: 24px;
  background: var(--accent); color: var(--accent-text);
  text-decoration: none; font-size: 15px;
  font-family: var(--font-display); font-weight: 600;
  transition: opacity 0.2s; white-space: nowrap; flex-shrink: 0;
}
.hero-cta:hover { opacity: 0.85; }
.ig-links { display: flex; gap: 12px; justify-content: flex-start; flex-wrap: wrap; }
.ig-link {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px; border-radius: 24px;
  background: var(--bg-card); border: 1px solid var(--border);
  color: #FFFFFF; text-decoration: none; font-size: 14px;
  font-family: var(--font-display); font-weight: 500;
  transition: all 0.2s;
}
.ig-link:hover { border-color: var(--accent); background: var(--accent-dim); }
.ig-link svg { width: 18px; height: 18px; fill: #FFFFFF; }

/* Stats bar */
.stats {
  display: flex; gap: 32px; justify-content: flex-start;
  margin-bottom: 40px; flex-wrap: wrap;
}
.stat { text-align: left; }
.stat-num {
  font-family: var(--font-display); font-size: 28px; font-weight: 800;
  color: var(--accent); font-variant-numeric: tabular-nums;
}
.stat-label { font-size: 12px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 1px; }

/* Search */
.search-wrap {
  position: sticky; top: env(safe-area-inset-top, 0px);
  z-index: 5; padding: 12px 0;
  background: var(--bg); transition: box-shadow 0.3s;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10;
  background: var(--bg);
}
.search-wrap.scrolled { box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
.search-box {
  position: relative; max-width: 600px; margin: 0 auto;
}
.search-box input {
  width: 100%; padding: 14px 48px 14px 44px;
  background: var(--bg-elevated); border: 0 none; box-shadow: none;
  border-radius: 28px; color: var(--fg-dim); font-size: 15px;
  font-family: var(--font-body); outline: none;
  transition: box-shadow 0.2s;
}
.search-box input:focus {
  box-shadow: 0 0 0 2px var(--accent) !important;
}
.search-box input::placeholder { color: var(--fg-muted); }
.search-icon {
  position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
  color: var(--fg-muted); pointer-events: none;
}
.search-clear {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  background: var(--fg-muted); border: none; color: var(--bg);
  width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
  font-size: 14px; display: none; align-items: center; justify-content: center;
  line-height: 1;
}
.search-clear.show { display: flex; }

/* Tabs / filter */
.tabs {
  display: flex; gap: 8px; margin-bottom: 24px;
  overflow-x: auto; padding-bottom: 4px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0; padding: 8px 16px; border-radius: 20px;
  background: var(--bg-card); border: 1px solid var(--border);
  color: var(--fg-dim); font-size: 13px; cursor: pointer;
  font-family: var(--font-display); font-weight: 500;
  transition: all 0.2s; white-space: nowrap;
}
.tab:hover { border-color: var(--fg-muted); color: var(--fg); }
.tab.active {
  background: var(--accent); border-color: var(--accent);
  color: var(--accent-text); font-weight: 600;
}
.tab .count {
  display: inline-block; margin-left: 4px;
  font-size: 11px; opacity: 0.7;
}

/* Section headers */
.section-header {
  font-family: var(--font-display); font-size: 20px; font-weight: 700;
  margin-bottom: 16px; display: flex; align-items: center; gap: 10px;
}
.section-header .line {
  flex: 1; height: 1px; background: var(--border);
}

/* Cover grid */
.cover-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px; margin-bottom: 40px;
}
.cover-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-md); overflow: hidden;
  transition: all 0.25s cubic-bezier(.4,0,.2,1);
  cursor: pointer; position: relative;
}
.cover-card:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}
.card-visual {
  height: 140px; position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.card-visual::after {
  content: ''; position: absolute; inset: 0;
  background: transparent;
}
.card-visual .play-icon {
  position: absolute; z-index: 2;
  width: 44px; height: 44px; border-radius: 50%;
  background: rgba(255,255,255,0.15); backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.2s;
}
.cover-card:hover .play-icon { opacity: 1; }
.play-icon svg { width: 20px; height: 20px; fill: #fff; margin-left: 2px; }
.card-body { padding: 14px 16px 16px; position: relative; z-index: 1; margin-top: 0; }
.card-song {
  font-family: var(--font-display); font-size: 15px; font-weight: 600;
  margin-bottom: 4px; line-height: 1.3; text-transform: capitalize;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-artist { font-size: 13px; color: var(--fg-dim); margin-bottom: 8px; }
.card-date { font-size: 12px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.card-ig {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; color: var(--accent); text-decoration: none;
  margin-top: 8px; font-weight: 500; transition: opacity 0.2s;
}
.card-ig:hover { opacity: 0.8; }
.card-ig svg { width: 14px; height: 14px; fill: currentColor; }
.card-new {
  position: absolute; top: 10px; right: 10px; z-index: 3;
  background: #E1AD01; color: #1B2A4A; font-size: 10px;
  padding: 2px 8px; border-radius: 10px; font-weight: 600;
  font-family: var(--font-display); letter-spacing: 0.5px;
}

/* No results */
.no-results { text-align: center; padding: 60px 20px; display: none; }
.no-results.show { display: block; }
.no-results h3 {
  font-family: var(--font-display); font-size: 22px; font-weight: 700;
  margin-bottom: 8px;
}
.no-results p { color: var(--fg-dim); font-size: 14px; margin-bottom: 24px; }
.wish-form { max-width: 400px; margin: 0 auto; }
.wish-input {
  display: flex; gap: 8px; margin-bottom: 12px;
}
.wish-input input {
  flex: 1; padding: 12px 16px; background: var(--bg-card);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--fg); font-size: 14px; font-family: var(--font-body); outline: none;
}
.wish-input input:focus { border-color: var(--accent); }
.wish-btn {
  padding: 12px 20px; background: var(--accent); color: var(--accent-text);
  border: none; border-radius: var(--radius-sm); cursor: pointer;
  font-family: var(--font-display); font-weight: 600; font-size: 14px;
  transition: opacity 0.2s; white-space: nowrap;
}
.wish-btn:hover { opacity: 0.85; }
.wish-list { margin-top: 16px; text-align: left; }
.wish-item {
  padding: 10px 14px; background: var(--bg-elevated);
  border-radius: var(--radius-sm); margin-bottom: 6px;
  font-size: 13px; display: flex; justify-content: space-between;
  align-items: center; animation: fadeUp 0.3s ease;
}
.wish-item .wish-votes {
  display: flex; align-items: center; gap: 4px;
  color: var(--accent); font-size: 12px; cursor: pointer;
}
.wish-toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--success); color: #000; padding: 10px 20px;
  border-radius: 24px; font-size: 14px; font-weight: 500;
  z-index: 100; opacity: 0; transition: opacity 0.3s;
  pointer-events: none;
}
.wish-toast.show { opacity: 1; }

/* Recommendations */
.recs { margin-top: 40px; }
.recs-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
}
.rec-card {
  background: var(--bg-elevated); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 14px;
  transition: all 0.2s; cursor: pointer;
}
.rec-card:hover { border-color: var(--accent); background: var(--bg-card-hover); }
.rec-song {
  font-family: var(--font-display); font-size: 14px; font-weight: 600;
  margin-bottom: 2px; text-transform: capitalize;
  display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
}
.rec-artist { font-size: 12px; color: var(--fg-dim); }

/* Artist section */
.artist-section { margin-bottom: 48px; }
.artist-banner {
  display: flex; align-items: center; gap: 16px;
  padding: 20px; background: var(--bg-card); border-radius: var(--radius-md);
  border: 1px solid var(--border); margin-bottom: 16px;
}
.artist-icon {
  width: 52px; height: 52px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 800; font-size: 20px;
  color: #fff; flex-shrink: 0;
}
.artist-info h2 {
  font-family: var(--font-display); font-size: 18px; font-weight: 700;
}
.artist-info span { font-size: 13px; color: var(--fg-dim); }

/* Lesson inquiry */
.lesson-section { margin-top: 60px; }
.lesson-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 32px; text-align: center;
}
.lesson-icon { font-size: 40px; margin-bottom: 12px; }
.lesson-card h3 {
  font-family: var(--font-display); font-size: 22px; font-weight: 700;
  margin-bottom: 8px;
}
.lesson-card p {
  color: var(--fg-dim); font-size: 14px; max-width: 400px;
  margin: 0 auto 24px; line-height: 1.7;
}
.lesson-form {
  max-width: 400px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 10px;
}
.lesson-form input, .lesson-form textarea {
  padding: 12px 16px; background: var(--bg-elevated);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--fg); font-size: 14px; font-family: var(--font-body);
  outline: none; resize: vertical;
}
.lesson-form input:focus, .lesson-form textarea:focus { border-color: var(--accent); }
.lesson-note {
  color: var(--fg-muted); font-size: 12px; margin: 0 auto 16px;
  max-width: 400px; line-height: 1.6;
}
.lesson-btn {
  padding: 14px 24px; background: var(--accent); color: var(--accent-text);
  border: none; border-radius: var(--radius-sm); cursor: pointer;
  font-family: var(--font-display); font-weight: 600; font-size: 15px;
  transition: opacity 0.2s;
}
.lesson-btn:hover { opacity: 0.85; }

/* Footer */
.footer {
  text-align: center; padding: 32px 0; margin-top: 40px;
  border-top: 1px solid var(--border); color: var(--fg-muted); font-size: 12px;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.fade-in { animation: fadeUp 0.35s ease forwards; }

/* Responsive */
@media (max-width: 600px) {
  .cover-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .card-visual { height: 100px; }
  .card-body { padding: 10px 12px 14px; }
  .card-song { font-size: 13px; }
  .stats { gap: 20px; }
  .recs-grid { grid-template-columns: 1fr 1fr; }
  .container { padding-block: 32px 60px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>

// Genre mapping for recommendations
const GENRE_MAP = {
  'metalcore': ['Architects','Bad Omens','Crystal Lake','I Prevail','Wage War','Fit for a King','Polaris','Novelists','ERRA','Thornhill','Coldrain','DON BROCO','Alpha Wolf','Normandie','CVLTE'],
  'post-hardcore': ['Bring Me the Horizon','Dayseeker','Sleep Token','Spiritbox','The Plot In You','Motionless In White','Paramore','Loathe x Joji','I See Stars','Linkin Park'],
  'deathcore': ['Chelsea Grin','Thy Art is Murder','Within Destruction','Brand of Sacrifice','Suicide Silence','Whitechapel','NOCTURNAL BLOODLUST','DEATHNYANN','Darko Us','Ten56','DIESECT','Diepression'],
  'jpop-jrock': ['ONE OK ROCK','Vaundy','Yorushika','ZUTOMAYO','King Gnu','Aimer','Majiko','My First Story','KNOSIS','9Lana','PALEDUSK','Motifhive','Earthists','OBSESS','Coldrain'],
  'tw-rock': ['帕崎拉','福夢FUMON','隨性樂團','薄暮EVENFALL','Diepression'],
};

function getGenres(artist) {
  const genres = [];
  for (const [g, artists] of Object.entries(GENRE_MAP)) {
    if (artists.some(a => a.toLowerCase() === artist.toLowerCase())) genres.push(g);
  }
  return genres;
}

function getRelated(cover, exclude = [], count = 6) {
  const genres = getGenres(cover.artist);
  const sameArtist = COVERS.filter(c => c.artist.toLowerCase() === cover.artist.toLowerCase() && c.song !== cover.song && !exclude.includes(c.song));
  const sameGenre = COVERS.filter(c => {
    if (c.song === cover.song || sameArtist.includes(c)) return false;
    if (exclude.includes(c.song)) return false;
    const cGenres = getGenres(c.artist);
    return cGenres.some(g => genres.includes(g));
  });
  const shuffle = arr => arr.sort(() => Math.random() - 0.5);
  return [...shuffle(sameArtist), ...shuffle(sameGenre)].slice(0, count);
}

const ARTIST_PALETTE = [
  '#D96C2C','#274C56','#E7A84E','#3E8E7E','#9E5A3C',
  '#4A7C6F','#B8860B','#5B8A72','#C4956A','#34595E',
  '#C07830','#2E6B5A','#8B6F47','#6A8E7C','#F6E2B3',
  '#3B6960','#A0764B','#6B4E3D','#D4943A','#7A6652'
];
const ARTIST_COLOR_OVERRIDE = {
  'vaundy': '#D96C2C'
};
function hashColor(artist) {
  const key = artist.toLowerCase();
  if (ARTIST_COLOR_OVERRIDE[key]) return ARTIST_COLOR_OVERRIDE[key];
  let h = 0;
  for (let i = 0; i < key.length; i++) {
    h = ((h << 5) - h + key.charCodeAt(i)) | 0;
  }
  return ARTIST_PALETTE[Math.abs(h) % ARTIST_PALETTE.length];
}

function isNew(dateStr) {
  const d = new Date(dateStr);
  const now = new Date();
  return (now - d) < 14 * 24 * 60 * 60 * 1000;
}

function formatDate(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleDateString('zh-TW', { year: 'numeric', month: 'short', day: 'numeric' });
}

}

// Build artist counts
const artistCounts = {};
COVERS.forEach(c => {
  const key = c.artist;
  artistCounts[key] = (artistCounts[key] || 0) + 1;
});
const topArtists = Object.entries(artistCounts).sort((a, b) => b[1] - a[1]);
const uniqueArtists = topArtists.length;
document.getElementById('statArtists').textContent = uniqueArtists;

// Build tabs
const tabsEl = document.getElementById('tabs');
const allTab = document.createElement('div');
allTab.className = 'tab active';
allTab.textContent = '全部';
allTab.dataset.filter = 'all';
tabsEl.appendChild(allTab);

const hotTab2 = document.createElement('div');
hotTab2.className = 'tab';
hotTab2.textContent = '熱門 🔥';
hotTab2.dataset.filter = 'hot';
tabsEl.appendChild(hotTab2);

const HOT_SONGS = ['盜作','Cry Out','C.U.R.I.O.S.I.T.Y','Start Again','Deeper Deeper','Dehumanized','想你點菸','第二星系','SUCK TAIPEI'];

topArtists.filter(([, c]) => c >= 3).forEach(([artist, count]) => {
  const t = document.createElement('div');
  t.className = 'tab';
  t.innerHTML = `${escHtml(artist)} <span class="count">${count}</span>`;
  t.dataset.filter = artist;
  tabsEl.appendChild(t);
});

// State
let currentFilter = 'all';
let searchQuery = '';

function getFiltered() {
  let list = [...COVERS];
  if (currentFilter === 'hot') {
    return HOT_SONGS.map(s => list.find(c => c.song === s)).filter(Boolean);
  }
  if (currentFilter !== 'all') {
    list = list.filter(c => c.artist === currentFilter);
  }
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(c =>
      c.song.toLowerCase().includes(q) ||
      c.artist.toLowerCase().includes(q)
    );
  }
  list.sort((a, b) => new Date(b.date) - new Date(a.date));
  return list;
}

function render() {
  const filtered = getFiltered();
  const main = document.getElementById('mainContent');
  const noRes = document.getElementById('noResults');

  if (filtered.length === 0 && searchQuery) {
    main.innerHTML = '';
    noRes.classList.add('show');
    document.getElementById('noResultsText').textContent =
      `找不到「${searchQuery}」相關的翻唱，但你可以許願讓他知道！`;
    const noResultRecs = document.getElementById('noResultRecs');
    noResultRecs.innerHTML = '';
    const recs = [...COVERS].sort(() => Math.random() - 0.5).slice(0, 6);
    renderRecs(noResultRecs, recs, '也許你會喜歡');
    return;
  }

  noRes.classList.remove('show');

  if (currentFilter !== 'all' && currentFilter !== 'hot' && !searchQuery) {
    const artist = currentFilter;
    const songs = filtered;
    main.innerHTML = '';
    const section = document.createElement('div');
    section.className = 'artist-section';
    const c1 = hashColor(artist);
    section.innerHTML = `
      <div class="artist-banner">
        <div class="artist-icon" style="background:${c1}">${artist.charAt(0).toUpperCase()}</div>
        <div class="artist-info">
          <h2>${escHtml(artist)}</h2>
          <span>${songs.length} covers</span>
        </div>
      </div>
    `;
    const grid = document.createElement('div');
    grid.className = 'cover-grid';
    songs.forEach(c => grid.appendChild(createCoverCard(c)));
    section.appendChild(grid);
    main.appendChild(section);

    if (songs.length > 0) {
      const related = getRelated(songs[0], songs.map(s => s.song), 6);
      if (related.length) renderRecs(main, related, '你可能也有興趣');
    }
    return;
  }

  main.innerHTML = '';

  if (searchQuery && filtered.length > 0) {
    const header = document.createElement('div');
    header.className = 'section-header';
    header.innerHTML = `搜尋結果 <span class="line"></span>`;
    main.appendChild(header);

    const grid = document.createElement('div');
    grid.className = 'cover-grid';
    filtered.forEach(c => grid.appendChild(createCoverCard(c)));
    main.appendChild(grid);

    const recs = getRelated(filtered[0], filtered.map(f => f.song), 6);
    if (recs.length) renderRecs(main, recs, '你可能也有興趣');
    return;
  }

  const label = currentFilter === 'hot' ? '熱門翻唱 🔥' : '所有翻唱';
  const header = document.createElement('div');
  header.className = 'section-header';
  header.innerHTML = `${label} <span class="line"></span>`;
  main.appendChild(header);

  const grid = document.createElement('div');
  grid.className = 'cover-grid';
  filtered.forEach(c => grid.appendChild(createCoverCard(c)));
  main.appendChild(grid);
}

function renderRecs(container, recs, title) {
  const section = document.createElement('div');
  section.className = 'recs';
  section.innerHTML = `<div class="section-header">${title} <span class="line"></span></div>`;
  const grid = document.createElement('div');
  grid.className = 'recs-grid';
  recs.forEach(c => {
    const card = document.createElement('div');
    card.className = 'rec-card';
    card.innerHTML = `<div class="rec-song">${escHtml(c.song)}</div><div class="rec-artist">${escHtml(c.artist)}</div>`;
    card.addEventListener('click', () => window.open(c.link, '_blank'));
    grid.appendChild(card);
  });
  section.appendChild(grid);
  container.appendChild(section);
}

// Tab clicks
tabsEl.addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  tabsEl.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  currentFilter = tab.dataset.filter;
  render();
});

// Search
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');
let searchTimer;
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchQuery = searchInput.value.trim();
  searchClear.classList.toggle('show', searchQuery.length > 0);
  searchTimer = setTimeout(render, 200);
});
searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchQuery = '';
  searchClear.classList.remove('show');
  render();
  searchInput.focus();
});

// Sticky search shadow
const searchWrap = document.getElementById('searchWrap');
const observer = new IntersectionObserver(
  ([e]) => searchWrap.classList.toggle('scrolled', e.intersectionRatio < 1),
  { threshold: [1], rootMargin: '-1px 0px 0px 0px' }
);
observer.observe(searchWrap);

// ===== 表單送出（透過 fetch 到 Apps Script）=====
function postToSheet(data) {
  const params = new URLSearchParams(data);
  return fetch(SCRIPT_URL + '?' + params.toString(), { redirect: 'follow' })
    .then(r => r.json())
    .then(j => j.success === true)
    .catch(() => false);
}

// Wishlist
const wishList = document.getElementById('wishList');
const wishInput = document.getElementById('wishInput');
const wishBtn = document.getElementById('wishBtn');
const wishToast = document.getElementById('wishToast');

wishBtn.addEventListener('click', async () => {
  const text = wishInput.value.trim();
  if (!text) return;
  wishBtn.disabled = true;
  wishBtn.textContent = '送出中⋯';
  const ok = await postToSheet({ action: 'addWish', song: text });
  wishBtn.disabled = false;
  wishBtn.textContent = '許願 ✨';
  wishInput.value = '';
  wishToast.textContent = ok ? '已送出許願！🎵' : '送出失敗，請再試一次';
  wishToast.style.background = ok ? 'var(--success)' : 'var(--danger)';
  wishToast.style.color = ok ? '#000' : '#fff';
  wishToast.classList.add('show');
  setTimeout(() => { wishToast.classList.remove('show'); }, 2000);
});
wishInput.addEventListener('keydown', e => { if (e.key === 'Enter') wishBtn.click(); });

// Lesson inquiry
const lessonBtn = document.getElementById('lessonBtn');
lessonBtn.addEventListener('click', async () => {
  const name = document.getElementById('lessonName').value.trim();
  const contact = document.getElementById('lessonContact').value.trim();
  const msg = document.getElementById('lessonMsg').value.trim();
  if (!name || !contact) {
    wishToast.textContent = '請填寫名字和聯絡方式！';
    wishToast.style.background = 'var(--danger)';
    wishToast.style.color = '#fff';
    wishToast.classList.add('show');
    setTimeout(() => { wishToast.classList.remove('show'); }, 2000);
    return;
  }
  lessonBtn.disabled = true;
  lessonBtn.textContent = '送出中⋯';
  const ok = await postToSheet({ action: 'addLesson', name, contact, message: msg });
  lessonBtn.disabled = false;
  lessonBtn.textContent = '送出詢問 →';
  document.getElementById('lessonName').value = '';
  document.getElementById('lessonContact').value = '';
  document.getElementById('lessonMsg').value = '';
  wishToast.textContent = ok ? '已送出課程詢問！🎤' : '送出失敗，請再試一次';
  wishToast.style.background = ok ? 'var(--success)' : 'var(--danger)';
  wishToast.style.color = ok ? '#000' : '#fff';
  wishToast.classList.add('show');
  setTimeout(() => { wishToast.classList.remove('show'); }, 2000);
});

function rebuildUI() {
  const ac = {};
  COVERS.forEach(c => { ac[c.artist] = (ac[c.artist] || 0) + 1; });
  const ta = Object.entries(ac).sort((a, b) => b[1] - a[1]);
  document.getElementById('statTotal').textContent = COVERS.length;
  document.getElementById('statArtists').textContent = ta.length;
  const years = COVERS.map(c => parseInt(c.date)).filter(y => y > 2000);
  if (years.length) document.getElementById('statSince').textContent = Math.min(...years);

  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  const allT = document.createElement('div');
  allT.className = 'tab active'; allT.textContent = '全部'; allT.dataset.filter = 'all';
  tabsEl.appendChild(allT);
  const hotT = document.createElement('div');
  hotT.className = 'tab'; hotT.textContent = '熱門 🔥'; hotT.dataset.filter = 'hot';
  tabsEl.appendChild(hotT);
  ta.filter(([, c]) => c >= 3).forEach(([artist, count]) => {
    const t = document.createElement('div');
    t.className = 'tab';
    t.innerHTML = `${escHtml(artist)} <span class="count">${count}</span>`;
    t.dataset.filter = artist;
    tabsEl.appendChild(t);
  });

  currentFilter = 'all';
  render();
}

// Try to fetch latest covers from Apps Script API
function loadFromSheet() {
  if (!SCRIPT_URL || SCRIPT_URL.includes('___REPLACE')) return;
  fetch(SCRIPT_URL + '?action=getCovers', { redirect: 'follow' })
    .then(r => r.json())
    .then(rows => {
      if (rows && rows.length) { COVERS = rows; rebuildUI(); }
    })
    .catch(() => {});
}

// Init
render();
loadFromSheet();
</script>
